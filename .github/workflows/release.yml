name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and notarize (${{ matrix.arch }})
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Verify toolchain and architecture
        run: |
          swift --version
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Run tests
        run: swift test

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/obs-stopwatch-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE_P12" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize DMG
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARIZE: "true"
          SIGNING_IDENTITY: "Developer ID Application: Harrison Green (${{ vars.APPLE_TEAM_ID }})"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x scripts/build-release.sh
          scripts/build-release.sh "$VERSION" "${{ matrix.arch }}"

      - name: Upload notarized DMG
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-${{ matrix.arch }}
          path: dist/OBS-Stopwatch-*-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Clean signing material
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "${CERTIFICATE_PATH:-}" "${APPLE_API_KEY_PATH:-}"

  publish:
    name: Publish GitHub release
    needs:
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "dist/OBS-Stopwatch-$VERSION-arm64.dmg"
          test -f "dist/OBS-Stopwatch-$VERSION-x86_64.dmg"
          (
            cd dist
            sha256sum *.dmg > SHA256SUMS.txt
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp --suffix=.md)"
          cat > "$NOTES_FILE" <<EOF
          # OBS Stopwatch $VERSION

          Native signed and notarized builds are available for:

          - Apple Silicon (\`arm64\`)
          - Intel (\`x86_64\`)

          Download the DMG matching your Mac, open it, and drag **OBS Stopwatch** to **Applications**.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "OBS Stopwatch $VERSION" \
            --notes-file "$NOTES_FILE" \
            --verify-tag

          rm -f "$NOTES_FILE"
